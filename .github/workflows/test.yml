name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install renderer dependency
        run: npm ci --no-audit --no-fund
      - name: Build and validate public site
        run: npm run site:check
      - name: Validate Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run
      - name: Core tests
        run: python3 tests/test_core.py
      - name: Damage regression tests
        run: python3 tests/test_damage_regressions.py
      - name: MCP stdio smoke test
        run: python3 tests/test_mcp_smoke.py
      - name: MCP Streamable HTTP smoke test
        run: python3 tests/test_remote_http.py
      - name: Build remote MCP Docker image
        run: docker build -t sssp-mcp:test .
